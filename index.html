<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운명의 나침반 - 선택형 종합 사주</title>
    <style>
        :root {
            --bg-color: #0d0f1a;
            --card-bg: #16192b;
            --accent-neon: #66fcf1;
            --accent-pink: #ff65a3;
            --accent-gold: #fbc531;
            --text-muted: #a5a7b4;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 25px rgba(102,252,241,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: var(--accent-neon);
            margin-bottom: 5px;
            font-size: 26px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 입력 양식 */
        .input-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--accent-neon);
            font-weight: bold;
            text-transform: uppercase;
        }

        .flex-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input[type="time"] {
            width: 100%;
            padding: 12px;
            background-color: #0d0f1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-neon);
        }

        /* 사주 종류 선택 탭 */
        .tab-container {
            display: flex;
            background-color: #0d0f1a;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: rgba(102, 252, 241, 0.15);
            color: var(--accent-neon);
        }

        .tab-btn.active.btn-flower {
            background-color: rgba(255, 101, 163, 0.15);
            color: var(--accent-pink);
        }

        .tab-btn.active.btn-gem {
            background-color: rgba(251, 197, 49, 0.15);
            color: var(--accent-gold);
        }

        /* 메인 실행 버튼 */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-neon), #398682);
            border: none;
            border-radius: 12px;
            color: #0d0f1a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 252, 241, 0.3);
        }

        /* 결과 창 구역 */
        .result-card {
            display: none;
            margin-top: 25px;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .res-icon {
            font-size: 65px;
            margin-bottom: 10px;
            display: inline-block;
            animation: floater 3s infinite ease-in-out;
        }

        @keyframes floater {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .res-type {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .res-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .res-sub {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .res-desc {
            font-size: 15px;
            line-height: 1.7;
            color: #d1d4dc;
            text-align: left;
            background-color: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔮 운명의 타로 나침반</h1>
    <p class="subtitle">보고 싶은 사주 테마를 직접 선택해서 확인하세요</p>

    <div class="input-box">
        <label>생년월일 선택</label>
        <div class="flex-inputs">
            <select id="month">
                <option value="">월</option>
                <script>for(let i=1; i<=12; i++) document.write(`<option value="${i}">${i}월</option>`);</script>
            </select>
            <select id="day">
                <option value="">일</option>
                <script>for(let i=1; i<=31; i++) document.write(`<option value="${i}">${i}일</option>`);</script>
            </select>
        </div>

        <label>태어난 시간</label>
        <input type="time" id="time" value="12:00">
    </div>

    <label style="text-align: left; margin-left: 5px;">알고 싶은 사주 테마 선택</label>
    <div class="tab-container">
        <button class="tab-btn active btn-star" onclick="switchTab('star')">별자리 사주</button>
        <button class="tab-btn btn-flower" onclick="switchTab('flower')">탄생화 사주</button>
        <button class="tab-btn btn-gem" onclick="switchTab('gem')">탄생석 사주</button>
    </div>

    <button class="submit-btn" onclick="generateFortune()">선택한 운명 확인하기 🔍</button>

    <div id="resultCard" class="result-card">
        <div class="res-type" id="outType">THE STARS</div>
        <div class="res-icon" id="outIcon">🌌</div>
        <div class="res-title" id="outTitle">결과 타이틀</div>
        <div class="res-sub" id="outSub">부제목</div>
        <div class="res-desc" id="outDesc">상세 사주 내용이 이곳에 표시됩니다.</div>
    </div>
</div>

<script>
    // 현재 선택된 사주 탭 상태 관리 ('star', 'flower', 'gem')
    let currentTab = 'star';

    // 탭 전환 기능
    function switchTab(type) {
        currentTab = type;
        
        // 모든 탭 버튼 활성화 클래스 제거
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        // 클릭한 버튼만 활성화
        if(type === 'star') document.querySelector('.btn-star').classList.add('active');
        if(type === 'flower') document.querySelector('.btn-flower').classList.add('active');
        if(type === 'gem') document.querySelector('.btn-gem').classList.add('active');

        // 이미 결과창이 켜져 있다면, 탭을 바꿨을 때 실시간 반영해 주면 센스 만점
        if(document.getElementById("resultCard").style.display === "block") {
            generateFortune();
        }
    }

    // 데이터셋 정의

        { name: "쌍둥이자리", start: [5, 21], end: [6, 21], emoji: "🎭", title: "자아가 4개쯤 있는 프로 수다꾼", desc: "한시도 입을 쉬지 않거나 머릿속으로 끊임없이 수다를 떠는 정보 과부하 인간. 이리저리 호기심은 많아서 이것저것 다 건드리지만 진득하게 끝까지 하는 건 별로 없는 매력쟁이입니다." },

        { name: "사자자리", start: [7, 23], end: [8, 22], emoji: "🦁", title: "주인공이 아니면 죽음을 달라는 관종", desc: "어디서나 센터에 서야 직성이 풀리는 본투비 연예인 체질. 칭찬을 먹고 자라기 때문에 '멋있다', '최고다' 한 마디만 해주면 간이라도 빼주는 단순하고 의리 넘치는 성격입니다." },

        { name: "천칭자리", start: [9, 23], end: [10, 23], emoji: "⚖️", title: "결정 장애를 앓고 있는 평화주의자", desc: "짜장면이냐 짬뽕이냐만 가지고도 30분 동안 고뇌할 수 있는 우유부단함의 아이콘. 하지만 모두에게 친절하고 매너가 좋아서 어딜 가나 인기가 많고 비주얼이 훌륭한 편입니다." },

    ];

    const flowerData = {
        1: { name: "수선화", emoji: "🌼", title: "나르시시즘의 귀환", desc: "자기애와 당당함이 최고의 무기인 타입! 스스로에 대한 프라이드가 높아서 남들의 시선에 쉽게 휘둘리지 않는 멘탈 갑 성향입니다." },

    const gemData = {

    function getTimeText(timeStr) {
        if(!timeStr) return "";
        const hour = parseInt(timeStr.split(":")[0]);
        if (hour >= 5 && hour < 9) return "<br><br>⏰ <b>시간 보너스:</b> 이른 아침의 기운이 섞여 시작의 추진력이 좋으나 오전 텐션 관리가 필수입니다.";
        if (hour >= 9 && hour < 17) return "<br><br>⏰ <b>시간 보너스:</b> 한낮의 강한 기운으로 오지랖과 활력이 넘치니 에너지 분배를 잘해야 합니다.";
        if (hour >= 17 && hour < 21) return "<br><br>⏰ <b>시간 보너스:</b> 저녁의 노을 감성이 들어와 새벽녘에 감성이 폭발해 흑역사를 정주행할 수 있습니다.";
        return "<br><br>⏰ <b>시간 보너스:</b> 자정의 야행성 기운으로 낮에는 충전 모드, 밤만 되면 눈이 반짝이는 올빼미 기질이 있습니다.";
    }

    // 메인 연산 및 화면 출력
    function generateFortune() {
        const month = parseInt(document.getElementById("month").value);
        const day = parseInt(document.getElementById("day").value);
        const time = document.getElementById("time").value;

        if (!month || !day) {
            alert("생일의 월과 일을 먼저 선택해 주세요! 🔮");
            return;
        }

        const timeBonus = getTimeText(time);
        const card = document.getElementById("resultCard");
        
        // 1. 별자리 탭 선택 시
        if (currentTab === 'star') {
            let matched = starData.find(c => {
                const [sMonth, sDay] = c.start;
                const [eMonth, eDay] = c.end;
                return (month === sMonth && day >= sDay) || (month === eMonth && day <= eDay);
            });
            if (!matched) matched = starData.find(c => c.name === "염소자리");

            document.getElementById("outType").innerText = "CONSTELLATION FORTUNE";
            document.getElementById("outType").style.color = "var(--accent-neon)";
            document.getElementById("outIcon").innerText = matched.emoji;
            document.getElementById("outTitle").innerText = matched.name;
            document.getElementById("outSub").innerText = `"${matched.title}"`;
            document.getElementById("outDesc").innerHTML = matched.desc + timeBonus;
        } 
        
        // 2. 탄생화 탭 선택 시
        else if (currentTab === 'flower') {
            const matched = flowerData[month];
            document.getElementById("outType").innerText = "BIRTH FLOWER FORTUNE";
            document.getElementById("outType").style.color = "var(--accent-pink)";
            document.getElementById("outIcon").innerText = matched.emoji;
            document.getElementById("outTitle").innerText = matched.name;
            document.getElementById("outSub").innerText = `"${matched.title}"`;
            document.getElementById("outDesc").innerHTML = matched.desc + timeBonus;
        } 
        
        // 3. 탄생석 탭 선택 시
        else if (currentTab === 'gem') {
            const matched = gemData[month];
            document.getElementById("outType").innerText = "BIRTH GEM FORTUNE";
            document.getElementById("outType").style.color = "var(--accent-gold)";
            document.getElementById("outIcon").innerText = matched.emoji;
            document.getElementById("outTitle").innerText = matched.name;
            document.getElementById("outSub").innerText = `"${matched.title}"`;
            document.getElementById("outDesc").innerHTML = matched.desc + timeBonus;
        }

        // 결과창 부드럽게 출력
        card.style.display = "block";
        card.scrollIntoView({ behavior: 'smooth' });
    }
