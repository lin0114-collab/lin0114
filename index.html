<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운명의 나침반 - 선택형 종합 사주</title>
    <style>
        :root {
            --bg-color: #0d0f1a;
            --card-bg: #16192b;
            --accent-neon: #66fcf1;
            --accent-pink: #ff65a3;
            --accent-gold: #fbc531;
            --text-muted: #a5a7b4;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 25px rgba(102,252,241,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: var(--accent-neon);
            margin-bottom: 5px;
            font-size: 26px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 입력 양식 */
        .input-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--accent-neon);
            font-weight: bold;
            text-transform: uppercase;
        }

        .flex-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input[type="time"] {
            width: 100%;
            padding: 12px;
            background-color: #0d0f1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-neon);
        }

        /* 사주 종류 선택 탭 */
        .tab-container {
            display: flex;
            background-color: #0d0f1a;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: rgba(102, 252, 241, 0.15);
            color: var(--accent-neon);
        }

        .tab-btn.active.btn-flower {
            background-color: rgba(255, 101, 163, 0.15);
            color: var(--accent-pink);
        }

        .tab-btn.active.btn-gem {
            background-color: rgba(251, 197, 49, 0.15);
            color: var(--accent-gold);
        }

        /* 메인 실행 버튼 */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-neon), #398682);
            border: none;
            border-radius: 12px;
            color: #0d0f1a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
